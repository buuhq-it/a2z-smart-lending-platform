<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full mb-4">
          <i class="pi pi-building text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Smart Lending</h1>
        <p class="text-gray-600">Hệ thống quản trị cho vay thông minh</p>
      </div>
  
      <p-card class="shadow-xl border-0 overflow-hidden">
        <!-- Custom Header -->
        <ng-template pTemplate="header">
          <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6">
            <div class="flex items-center gap-3">
              <i class="pi pi-shield text-2xl"></i>
              <div>
                <h2 class="text-xl font-bold mb-1">Đăng nhập Admin</h2>
                <p class="text-blue-100 text-sm">Nhập thông tin đăng nhập để truy cập hệ thống</p>
              </div>
            </div>
          </div>
        </ng-template>
  
        <!-- Form Content -->
        <div class="p-8">
          <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
            
            <!-- Error Message -->
            <p-message 
              *ngIf="errorMessage" 
              severity="error" 
              [text]="errorMessage"
              styleClass="w-full">
            </p-message>
  
            <!-- Username Field -->
            <div class="space-y-2">
              <label for="username" class="block text-sm font-medium text-gray-700">
                <i class="pi pi-user mr-1 text-blue-600"></i>
                Tên đăng nhập
              </label>
              <input 
                pInputText 
                id="username" 
                type="text" 
                [(ngModel)]="loginData.username" 
                name="username" 
                placeholder="Nhập tên đăng nhập" 
                required 
                class="w-full h-12" 
                [disabled]="isLoading"
                autocomplete="username"
              />
            </div>
  
            <!-- Password Field -->
            <div class="space-y-2">
              <label for="password" class="block text-sm font-medium text-gray-700">
                <i class="pi pi-lock mr-1 text-blue-600"></i>
                Mật khẩu
              </label>
              <p-password 
                inputId="password" 
                [(ngModel)]="loginData.password" 
                name="password" 
                placeholder="Nhập mật khẩu" 
                required 
                [disabled]="isLoading"
                [feedback]="false"
                [toggleMask]="true"
                styleClass="w-full"
                inputStyleClass="w-full h-12"
                autocomplete="current-password">
              </p-password>
            </div>
  
            <!-- Remember Me & Forgot Password -->
            <div class="flex items-center justify-between">
              <div class="flex items-center">
                <p-checkbox 
                  inputId="rememberMe" 
                  [(ngModel)]="loginData.rememberMe" 
                  name="rememberMe" 
                  [binary]="true"
                  [disabled]="isLoading">
                </p-checkbox>
                <label for="rememberMe" class="ml-2 text-sm text-gray-600">
                  Ghi nhớ đăng nhập
                </label>
              </div>
              <button 
                type="button" 
                (click)="onForgotPassword()" 
                class="text-sm text-blue-600 hover:text-blue-800 hover:underline">
                Quên mật khẩu?
              </button>
            </div>
  
            <!-- Submit Button -->
            <button 
              pButton 
              type="submit" 
              [label]="isLoading ? 'Đang đăng nhập...' : 'Đăng nhập'" 
              [disabled]="isLoading || !loginData.username || !loginData.password" 
              class="w-full h-14 text-lg font-semibold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 transition-all duration-200">
              <i class="pi pi-spin pi-spinner mr-2" *ngIf="isLoading"></i>
              <i class="pi pi-shield mr-2" *ngIf="!isLoading"></i>
            </button>
          </form>
  
          <!-- Security Notice -->
          <div class="mt-6 pt-6 border-t border-gray-200">
            <div class="text-center text-sm text-gray-500">
              <div class="flex items-center justify-center gap-1 mb-2">
                <i class="pi pi-shield text-blue-600"></i>
                <span>Kết nối bảo mật SSL</span>
              </div>
              <p class="text-xs">Chỉ dành cho nhân viên được ủy quyền</p>
            </div>
          </div>
        </div>
      </p-card>
  
      <!-- Footer -->
      <div class="text-center mt-6 text-xs text-gray-500">
        © 2024 Smart Lending System. Bảo lưu mọi quyền.
      </div>
    </div>
  </div>
